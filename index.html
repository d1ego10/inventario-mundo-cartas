
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Cartas - Inicio de sesión</title>
</head>
<body>

    <h1>Mundo Cartas</h1>
    <p>Bienvenido a Mundo Cartas</p>

    <section>
        <h2>Iniciar sesión</h2>

        <form action="#" method="post">
            <label for="login-correo">Correo electrónico:</label>
            <input type="email" id="login-correo"
                name="correo" required>

            <br><br>

            <label for="login-password">Contraseña:</label>
            <input type="password" id="login-password"
                name="password" required>

            <br><br>

            <button type="submit">Iniciar sesión</button>
        </form>
    </section>

    <hr>

    <section>
        <h2>Crear cuenta</h2>

        <form action="#" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre"
                name="nombre" required>

            <br><br>

            <label for="registro-correo">Correo electrónico:</label>
            <input type="email" id="registro-correo"
                name="correo" required>

            <br><br>

            <label for="registro-password">Contraseña:</label>
            <input type="password" id="registro-password"
                name="password" required>

            <br><br>

            <label for="confirmar-password">Confirmar contraseña:</label>
            <input type="password" id="confirmar-password"
                name="confirmar_password" required>

            <br><br>

            <button type="submit">Crear cuenta</button>
        </form>
    </section>

</body>
</html>
